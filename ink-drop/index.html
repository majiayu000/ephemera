<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>一滴墨 · Ephemera 浮光</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#efe8d8;touch-action:none}
canvas{display:block}
#intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#efe8d8;cursor:pointer;transition:opacity 1.6s;font-family:"STKaiti","Kaiti SC","KaiTi","Songti SC",serif;color:#1a191c}
#intro h1{font-weight:400;font-size:min(14vh,18vw);letter-spacing:.3em;margin:0 0 0 .3em}
#intro p{font-size:14px;letter-spacing:.4em;opacity:.55;margin:1.6em 0 0}
#intro p+p{margin-top:.6em}
#intro .seal{width:44px;height:44px;background:#b62420;color:#efe8d8;display:flex;align-items:center;justify-content:center;font-size:30px;margin-top:1.2em}
#intro.gone{opacity:0;pointer-events:none}
#bar{position:fixed;left:8vw;right:8vw;bottom:22px;height:34px;opacity:0;transition:opacity .6s;font:12px "Songti SC",serif;color:#1a191c;cursor:pointer;user-select:none}
#bar.show{opacity:.85}
#track{position:absolute;left:0;right:0;top:22px;height:2px;background:rgba(26,25,28,.15)}
#prog{position:absolute;left:0;top:0;height:2px;width:0;background:#1a191c}
.ch{position:absolute;top:0;letter-spacing:.2em;opacity:.5}
.ch.on{opacity:1;color:#b62420}
.ch::after{content:"";position:absolute;left:0;top:18px;width:1px;height:10px;background:rgba(26,25,28,.4)}
#pause{position:fixed;top:20px;left:24px;font:13px "Songti SC",serif;letter-spacing:.3em;color:#1a191c;opacity:0;transition:opacity .4s}
</style>
<meta name="description" content="约三分钟的六幕水墨短片，Canvas 与 Web Audio 实时生成；空格暂停，方向键跳转。">
<link rel="canonical" href="https://majiayu000.github.io/ephemera/ink-drop/">
<meta property="og:type" content="website">
<meta property="og:title" content="一滴墨 · Ephemera 浮光">
<meta property="og:description" content="约三分钟的六幕水墨短片，Canvas 与 Web Audio 实时生成；空格暂停，方向键跳转。">

<meta property="og:image:height" content="630">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="一滴墨 · Ephemera 浮光">

<body>
<canvas id="stage"></canvas>
<div id="intro">
  <h1>一滴墨</h1>
  <div class="seal">墨</div>
  <p>约三分钟 · 请开启声音 · 点击开始</p>
  <p>空格暂停 · 左右键快进 · 底部可跳转章节</p>
</div>
<div id="bar"><div id="track"><div id="prog"></div></div></div>
<div id="pause">暂 停</div>
<script type="module" src="main.js"></script>
</body>
