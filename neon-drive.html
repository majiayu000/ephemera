<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>霓虹夜驰</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none}
canvas{display:block}
#go{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:#ff5fc8;font:300 42px "PingFang SC",sans-serif;letter-spacing:.6em;text-shadow:0 0 18px #ff2fa8,0 0 42px #7a2bff;background:rgba(0,0,0,.35)}
#go small{margin-top:20px;font-size:13px;letter-spacing:.4em;color:#8fe9ff;text-shadow:0 0 10px #29c8ff}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="go">霓虹夜驰<small>点击启动 · 请开启声音</small></div>
<script src="shared/glkit.js"></script>
<script src="neon-drive-music.js"></script>
<script>
// B 鼓点脉冲 / E 能量（前奏 0.25，高潮 1）/ H 当前和弦序号（换霓虹色）/ F 高潮进入瞬间的闪光
const FS = `#version 300 es
precision highp float;
uniform vec2 R; uniform float T, B, E, H, F; out vec4 o;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
vec3 scene(vec2 uv){
  float hz=-.05;
  vec3 neon=mix(vec3(1.,.2,.8),vec3(.1,.9,1.),.5+.5*sin(H*1.5708));
  float y=max(hz-uv.y,1e-3), z=.3/y;
  vec2 g=vec2(uv.x*z*1.2,z+T*(2.+6.*E));
  vec2 d=abs(fract(g-.5)-.5), fw=fwidth(g)+1e-4;
  float ln=max(1.-smoothstep(0.,fw.x*1.5,d.x),1.-smoothstep(0.,fw.y*1.5,d.y));
  float glow=exp(-min(d.x/fw.x,d.y/fw.y)*.35);
  vec3 fl=vec3(.012,0.,.03)+neon*(ln*1.8+glow*.4)*exp(-z*.06)*(1.+1.8*B*E);

  float sy=uv.y-hz;
  vec3 sk=mix(vec3(.85,.12,.42),vec3(.01,0.,.04),smoothstep(0.,.45,sy));
  float st=h(floor(uv*90.));
  sk+=step(.988,st)*(.6+.4*sin(T*4.+st*80.))*smoothstep(.15,.5,sy);
  vec2 sc=vec2(0.,hz+.27); float r=.25*(1.+.05*B*E), sd=length(uv-sc);
  vec3 sun=mix(vec3(1.,.9,.25),vec3(1.,.1,.55),smoothstep(sc.y+r,sc.y-r,uv.y));
  float below=sc.y-uv.y, cut=below>0.?step(fract(below*16.-T*.8),below/r*.75):0.;
  sk=mix(sk,sun,smoothstep(r,r-.003,sd)*(1.-cut));
  sk+=sun*.45*exp(-max(sd-r,0.)*7.)*(1.+B*E*.6);
  float mh=hz+.015+.11*abs(sin(uv.x*3.3+.4)*sin(uv.x*1.3+1.))*smoothstep(.12,.8,abs(uv.x));
  sk=mix(sk,vec3(.015,0.,.04),step(uv.y,mh));
  sk+=neon*exp(-abs(uv.y-mh)*260.)*.9;

  vec3 col=uv.y>hz?sk:fl;
  col+=sun*.3*exp(-abs(uv.x)*5.)*exp(-y*6.)*step(uv.y,hz);
  col+=vec3(1.,.4,.8)*.25*exp(-abs(uv.y-hz)*40.);
  return col;
}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*R)/R.y;
  uv+=vec2(sin(T*53.),cos(T*47.))*.004*B*E;
  float ca=.002+.007*B*E;
  vec3 c=vec3(scene(uv+vec2(ca,0)).r,scene(uv).g,scene(uv-vec2(ca,0)).b);
  c*=.88+.12*sin(gl_FragCoord.y*1.3);
  c*=1.-.45*dot(uv,uv);
  c+=F*vec3(1.,.8,1.);
  c=1.-exp(-c*1.25);
  o=vec4(c,1);
}`;

const cv = document.getElementById('c'), go = document.getElementById('go');
const gl = glkit.context(cv, .8);
const prog = glkit.program(gl, glkit.FULLSCREEN_VS, FS);
const U = glkit.uniforms(gl, prog, ['R', 'T', 'B', 'E', 'H', 'F']);
let started = false;
go.addEventListener('click', () => { Music.start(); started = true; go.remove(); });

function frame(ms) {
  requestAnimationFrame(frame);
  const s = started ? Music.state() : { t: ms / 1000, bar: 0, beat: 0, full: false, drop: 0 };
  gl.uniform2f(U.R, cv.width, cv.height);
  gl.uniform1f(U.T, s.t);
  gl.uniform1f(U.B, s.beat);
  gl.uniform1f(U.E, s.full ? 1 : .25);
  gl.uniform1f(U.H, s.bar % 4);
  gl.uniform1f(U.F, s.drop);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
