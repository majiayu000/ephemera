name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check JavaScript
        run: |
          status=0
          for f in $(git ls-files '*.js'); do
            node --input-type=module --check < "$f" || { echo "FAIL $f"; status=1; }
          done
          exit $status
      - name: Gallery links resolve
        run: |
          status=0
          for href in $(grep -o 'href="[^"#:]*"' index.html | cut -d'"' -f2); do
            [ -e "$href" ] || { echo "missing $href"; status=1; }
          done
          exit $status
